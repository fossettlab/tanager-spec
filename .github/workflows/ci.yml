name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build-install:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install development environment
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Test
        run: uv run pytest
      - name: Build artifacts
        run: uv build --out-dir dist
      - name: Verify archives
        run: |
          unzip -t dist/tanager_spec-0.1.0-py3-none-any.whl
          gzip -t dist/tanager_spec-0.1.0.tar.gz
      - name: Install wheel outside checkout
        run: |
          uv venv --python "${{ matrix.python-version }}" /tmp/tanager-spec-wheel
          uv pip install --python /tmp/tanager-spec-wheel/bin/python dist/tanager_spec-0.1.0-py3-none-any.whl
          (
            cd /tmp
            env -u PYTHONPATH /tmp/tanager-spec-wheel/bin/python -I -c \
              'from importlib.metadata import version; from importlib.resources import files; import tanager_spec; assert version("tanager-spec") == tanager_spec.__version__ == "0.1.0"; assert files("tanager_spec").joinpath("data/S2A_SRF.csv").is_file()'
          )
          uv pip check --python /tmp/tanager-spec-wheel/bin/python
