[project]
name = "tanagerspec"
version = "0.1.0"
description = "Shared data layer for the Tanager hyperspectral-vs-multispectral methodology projects: STAC ingest, georeferenced cube IO, wavelength utilities, invalid/absorption masking, Sentinel-2 SRF simulation, and reproducible pixel sampling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Bradley", email = "abradley@wustl.edu" }]
keywords = ["hyperspectral", "tanager", "sentinel-2", "stac", "remote-sensing"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "xarray>=2024.1",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pystac-client>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/bradleylab/tanagerspec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tanagerspec"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, numpy-specific
select = ["E", "F", "I", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
